<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page-language="ar">
<head>
    <meta charset="UTF-8">
    <title>استوديو فحص الأداء</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/sr-unified-design-system.css">
    <style>
        .audit-container { max-width: 900px; margin: 2rem auto; padding: 1rem; }
        .metrics { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
        .metric { width: 120px; height: 120px; position: relative; }
        .metric canvas { width: 100%; height: 100%; }
        .metric-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 0.9rem; text-align: center; }
        .export-report { margin-top: 1.5rem; text-align: center; }
        .export-btn { padding: 8px 14px; background: #10b981; color:#fff; border:none; border-radius:4px; cursor:pointer; }
        .export-btn:hover { background:#059669; }
    </style>
</head>
<body>
    <nav class="sr-main-nav">
        <ul class="sr-nav-list">
            <li><a href="index.html" class="sr-nav-link">الرئيسية</a></li>
            <li><a href="tech-matrix.html" class="sr-nav-link">مصفوفة المقارنات التقنية</a></li>
            <li><a href="lottie-studio.html" class="sr-nav-link">استوديو Lottie</a></li>
            <li><a href="perf-audit.html" class="sr-nav-link">استوديو فحص الأداء</a></li>
        </ul>
    </nav>
    <main class="audit-container">
        <h1 class="sr-title">استوديو فحص الأداء (Web Performance &amp; Speed Audit)</h1>
        <section class="metrics" id="metricsSection">
            <div class="metric" id="lcpMetric"><canvas></canvas><div class="metric-label">LCP<br>(ثانية)</div></div>
            <div class="metric" id="fidMetric"><canvas></canvas><div class="metric-label">FID<br>(مللي‑ثانية)</div></div>
            <div class="metric" id="clsMetric"><canvas></canvas><div class="metric-label">CLS<br>(نقطة)</div></div>
            <div class="metric" id="ttfbMetric"><canvas></canvas><div class="metric-label">TTFB<br>(ثانية)</div></div>
        </section>
        <div class="export-report">
            <button class="export-btn" id="exportReportBtn">تصدير تقرير PDF</button>
        </div>
    </main>
    <script src="js/web-vitals.min.js"></script>
    <script src="js/perf-audit.js"></script>
</body>
</html>
