name: locale-drift

# Guards the one-source rule: if a locale page stops matching what the master
# would render, this job fails loudly. It never blocks the deploy workflow —
# it only reports the drift.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # الجرد الدوري الشهري: نفس بنك الحوارس يُشغَّل في أول كل شهر.
    # إدخال السجل المؤرخ في worklog.md يكتبه من يشغّل الفحص محلياً.
    - cron: '0 6 1 * *'

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The sentinel bank imports lxml (content depth parity + the per-portal
      # English scans). ci.yml installs the same dependency for the same
      # reason; without it every gate in this job fails on ModuleNotFoundError.
      - name: Install Python dependencies (lxml)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "lxml>=5.0"
      - name: Hero and style layers must match the master
        run: python scripts/sync_locales.py --check
      - name: Sentinel - every language and map guard in one pass
        run: python scripts/sentinel_i18n.py
