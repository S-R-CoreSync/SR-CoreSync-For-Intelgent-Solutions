    <script>
    // 沙盒里没有网站（dev server 没起 / 已退出）时，wsmgr 把沙盒 Caddy 自带的「每 5 秒无限刷新」502 页换成这一页。
    // 原页面只要标签页开着就一直每 5 秒打一次沙盒，沙盒因此永远不会空闲回收（一个 502 页=一个常驻沙盒实例）。
    // 这里：前 2 分钟仍每 5 秒刷新（给 dev server 启动留时间）；之后退避到最多 60 秒一次；总共 10 分钟后停止自动刷新，
    // 显示「重试」按钮；页面在后台（document.hidden）时不刷新，切回前台再刷新一次。
    // 外部触发的导航（前端 iframe reload、用户 F5、首次打开）会重新开始 2 分钟快速窗口；只有本页自己的刷新才延续退避。
    (function () {
        'use strict';
        var KEY = '__zai_nosite_v1';
        var FAST_MS = 5000;          // 快速窗口内的刷新间隔
        var FAST_WINDOW = 120000;    // 快速窗口长度
        var MAX_DELAY = 60000;       // 退避上限
        var STOP_AFTER = 600000;     // 从起点算起超过这个时间就停止自动刷新
        var FRESH_AFTER = 1800000;   // 距上次加载超过这个时间，当作全新开始
        var SELF_VALID = 60000;      // 自己触发的刷新，在这个时间内重新加载才算「延续」

        // 状态存 sessionStorage（每个 chat 一个预览域名，天然按 chat 隔离）；不可用时退到 window.name。
        var NAME_PREFIX = KEY + '=';
        function load() {
            var raw = null;
            try { raw = sessionStorage.getItem(KEY); } catch (e) { raw = null; }
            if (raw === null && typeof window.name === 'string' && window.name.indexOf(NAME_PREFIX) === 0) {
                raw = window.name.slice(NAME_PREFIX.length);
            }
            if (!raw) return null;
            try { var st = JSON.parse(raw); return (st && typeof st === 'object') ? st : null; } catch (e) { return null; }
        }
        function save(st) {
            var raw = JSON.stringify(st);
            try { sessionStorage.setItem(KEY, raw); return; } catch (e) { /* 退到 window.name */ }
            try { window.name = NAME_PREFIX + raw; } catch (e2) { /* 都不可用：下次加载按全新处理 */ }
        }

        // 返回下一次自动刷新前要等多久（毫秒），-1 表示不再自动刷新。elapsed=距起点毫秒，slow=已经做过几次慢速刷新。
        function nextDelay(elapsed, slow) {
            if (elapsed >= STOP_AFTER) return -1;
            if (elapsed < FAST_WINDOW) return FAST_MS;
            return Math.min(MAX_DELAY, 10000 * Math.pow(2, slow));
        }

        var now = Date.now();
        var st = load();
        var continuing = !!(st && st.selfAt && now - st.selfAt >= 0 && now - st.selfAt < SELF_VALID &&
            st.last && now - st.last < FRESH_AFTER && typeof st.t0 === 'number');
        if (!continuing) st = { t0: now, slow: 0 };
        st.last = now;
        st.selfAt = 0;
        save(st);

        var timer = null;
        var pending = false;   // 到点时页面在后台，等切回前台再刷新
        var stopped = false;

        function reloadSelf() {
            var t = Date.now();
            if (t - st.t0 >= FAST_WINDOW) st.slow = (st.slow || 0) + 1;
            st.selfAt = t;
            save(st);
            location.reload();
        }

        function showPaused() {
            stopped = true;
            var zh = /^zh/i.test((navigator && navigator.language) || '');
            document.getElementById('paused-msg').textContent = zh ? '网站暂未运行，已暂停自动刷新' : 'No site is running yet. Auto-refresh is paused.';
            document.getElementById('paused-retry').textContent = zh ? '重试' : 'Retry';
            document.getElementById('paused').style.display = 'flex';
        }

        function schedule() {
            var d = nextDelay(Date.now() - st.t0, st.slow || 0);
            if (d < 0) { showPaused(); return; }
            timer = setTimeout(function () {
                timer = null;
                if (document.hidden) { pending = true; return; }
                reloadSelf();
            }, d);
        }

        document.addEventListener('visibilitychange', function () {
            if (document.hidden) return;
            if (pending || stopped) {
                pending = false;
                reloadSelf();   // 回到前台只刷新一次；仍然 502 时按已有的退避状态继续或保持暂停
            }
        });

        // 手动重试不是本页自己的刷新（selfAt 为 0），下一页会当作全新开始，重新有 2 分钟快速窗口
        document.getElementById('paused-retry').addEventListener('click', function () {
            location.reload();
        });

        schedule();
    })();
