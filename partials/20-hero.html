<section id="hero" class="section-hero-v1 hero-reference">

<div class="hv2" id="hv2-hero">
    <div class="hero-stage-center">
        <!-- Intelligent Orb Core -->
        <div class="c3-core-orb-wrapper">
            <div class="c3-core-orb" id="heroOrbCore" data-sr-call="openLogoLightbox" data-sr-event="1" title="S&amp;R CoreSync Sovereign Intelligent Core">
                <div class="c3-orb-ring-outer"></div>
                <div class="c3-orb-ring-inner"></div>
                <img src="./assets/sr-core-emblem-official.webp" alt="S&amp;R CoreSync Sovereign Intelligent Core" width="88" height="88" class="c3-orb-img" loading="eager" decoding="async">
            </div>
        </div>

        <!-- Official Badge -->
        <div class="hv2__badge">
            <i></i> S&amp;R CoreSync For Intelligent Solutions
        </div>

        <!-- Rotating Title -->
        <h1 class="hv2__h1 hero-refined-title">
            <span class="hv2__rot" id="hv2-rot">

                <span>تطبيقات ومنصات رقمية</span>

        <!-- AI Idea Form -->
        <div class="hero-ai-idea-box">
            <form class="hero-ai-idea-form" data-sr-call="submitHeroAiIdea" data-sr-on="submit" data-sr-prevent="1">
                <div class="hero-ai-idea-icon-wrap" aria-hidden="true">
                    <span class="hero-ai-idea-sparkle">✨</span>
                </div>
                <div class="hero-ai-idea-input-wrap">
                    <input type="text" id="heroAiIdeaInput" class="hero-ai-idea-input" placeholder="اكتب فكرة مشروعك هنا…" autocomplete="off" aria-label="فكرة المشروع">
                </div>
                <div class="hero-ai-idea-btns">
                    <button type="button" class="hero-ai-idea-mic-btn" data-sr-call="openVoicePlannerFromHero" title="تحدث بفكرة مشروعك بالصوت التفاعلي" aria-label="تحدث بفكرة مشروعك بالصوت التفاعلي">
                        <span class="hero-ai-mic-icon">🎙️</span>
                    </button>
                    <button type="submit" class="hero-ai-idea-submit-btn" title="حلل فكرتي بالـ AI ⚡" aria-label="حلل فكرتي بالـ AI ⚡">
                        <span class="hero-ai-submit-text">حلّل فكرتي ✦</span>
                        <span class="hero-ai-submit-arrow">←</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Quick Chips Row directly above language dock -->
        <div class="hero-quick-chips-row">
            <a href="#services" class="hero-refined-chip">
                <span>🏢</span>

            <a href="#services" class="hero-refined-chip">

            </a>
            <a href="#services" class="hero-refined-chip">
                <span>👑</span>
                <span>هوية بصرية كاملة</span>
            </a>
            <a href="#services" class="hero-refined-chip">
                <span>⚡</span>
                <span>أتمتة وربط الأنظمة</span>
            </a>
            <a href="demo.html" class="hero-refined-chip chip-demo-highlight">
                <span>▶</span>
                <span>تجربة النظام السحابي الحي</span>
